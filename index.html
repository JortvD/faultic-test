<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Supply · Trail Kit</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="/">Field Supply</a>
    <span>Trail collection</span>
  </header>
  <main class="layout">
    <section class="intro" aria-labelledby="collection">
      <p class="eyebrow">Weekend essentials</p>
      <h1 id="collection">The Trail Kit</h1>
      <p>A compact set of everyday gear for a day outside.</p>
      <ul class="items">
        <li><strong>Trail flask</strong><span>$24.00</span></li>
        <li><strong>Packable towel</strong><span>$18.00</span></li>
        <li><strong>Field notebook</strong><span>$10.00</span></li>
      </ul>
    </section>
    <aside class="cart" aria-labelledby="cart-title">
      <h2 id="cart-title">Your cart</h2>
      <p>3 items</p>
      <dl>
        <div><dt>Subtotal</dt><dd>$52.00</dd></div>
        <div><dt>Shipping</dt><dd id="shipping-status">Free shipping</dd></div>
        <div class="total"><dt>Total</dt><dd>$52.00</dd></div>
      </dl>
      <button id="checkout" type="button">Checkout</button>
    </aside>
  </main>
  <footer>Field Supply · Demo storefront</footer>
</body>
</html>
