[package]
name = "faultic-logistics"
version = "1.1.1"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
getrandom = "0.4"
hex = "0.4"
ipnet = "2.12"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
libc = "0.2"
ring = "0.17.14"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
rust_decimal = { version = "1.43", default-features = false, features = ["std", "serde-with-arbitrary-precision"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6.11", features = ["fs", "set-header"] }
url = "2"
